<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김예빈의 지뢰게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 시작 화면 -->
  <section id="start-screen" class="screen active">
    <div class="hero">
      <h1 class="title">💣 지뢰게임</h1>
      <p class="author">made by <strong>김예빈</strong></p>

      <div class="player-input">
        <label for="player-name">플레이어 이름</label>
        <input type="text" id="player-name" maxlength="12" placeholder="이름을 입력하세요" />
      </div>

      <div class="difficulty">
        <h3>난이도 선택</h3>
        <div class="diff-buttons">
          <button class="diff-btn selected" data-diff="easy">
            쉬움<br /><small>9×9 · 지뢰 10개</small>
          </button>
          <button class="diff-btn" data-diff="medium">
            보통<br /><small>16×16 · 지뢰 40개</small>
          </button>
          <button class="diff-btn" data-diff="hard">
            어려움<br /><small>16×30 · 지뢰 99개</small>
          </button>
        </div>
      </div>

      <div class="start-actions">
        <button id="start-btn" class="primary-btn">게임 시작</button>
        <button id="view-ranking-btn" class="secondary-btn">🏆 랭킹 보기</button>
        <button id="view-reviews-btn" class="secondary-btn">💬 리뷰 보기</button>
      </div>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game-screen" class="screen">
    <div class="game-header">
      <button id="back-btn" class="icon-btn">← 메뉴</button>
      <div class="status-bar">
        <div class="stat">💣 <span id="mine-count">0</span></div>
        <button id="reset-btn" class="face-btn">🙂</button>
        <div class="stat">⏱ <span id="timer">0</span>s</div>
      </div>
      <div class="player-tag">👤 <span id="current-player">-</span></div>
    </div>

    <div id="board-wrap">
      <div id="board"></div>
    </div>

    <div id="result-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="result-title">🎉 승리!</h2>
        <p id="result-detail"></p>
        <div class="modal-score hidden" id="save-score-box">
          <p>점수가 저장되었습니다.</p>
        </div>
        <div class="review-box">
          <h3>💬 게임 리뷰 남기기</h3>
          <div class="rating" id="rating-stars">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
          </div>
          <textarea id="review-text" maxlength="300" placeholder="이 게임에 대한 후기를 남겨주세요 (선택)"></textarea>
          <button id="submit-review-btn" class="primary-btn">리뷰 등록</button>
        </div>
        <div class="modal-actions">
          <button id="play-again-btn" class="secondary-btn">다시 하기</button>
          <button id="to-menu-btn" class="secondary-btn">메뉴로</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 랭킹 화면 -->
  <section id="ranking-screen" class="screen">
    <div class="panel-header">
      <button class="icon-btn back-to-menu">← 메뉴</button>
      <h2>🏆 랭킹</h2>
    </div>
    <div class="tab-bar">
      <button class="tab-btn selected" data-tab="easy">쉬움</button>
      <button class="tab-btn" data-tab="medium">보통</button>
      <button class="tab-btn" data-tab="hard">어려움</button>
    </div>
    <div id="ranking-list" class="list"></div>
  </section>

  <!-- 리뷰 화면 -->
  <section id="reviews-screen" class="screen">
    <div class="panel-header">
      <button class="icon-btn back-to-menu">← 메뉴</button>
      <h2>💬 리뷰</h2>
    </div>
    <div id="reviews-list" class="list"></div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
